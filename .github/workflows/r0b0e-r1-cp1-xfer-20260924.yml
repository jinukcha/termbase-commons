name: temporary R0B0E R1 CP1 transfer

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/r0b0e-r1-cp1-xfer-20260924.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify CP1 delivery
        env:
          URL_B64: 
        run: |
          set -euo pipefail
          URL="$(printf '%s' "$URL_B64" | base64 -d)"
          curl -fL --retry 4 --retry-all-errors "$URL" -o WG_E_R1C1_delivery.zip
          echo 'ed9d3a4bf97ecc76a69f4a43d3d53ae91ebaeed4003a7100e5e804810d6ba0e4  WG_E_R1C1_delivery.zip' | sha256sum -c -
          unzip -tqq WG_E_R1C1_delivery.zip

      - name: Upload temporary connector artifact
        uses: actions/upload-artifact@v4
        with:
          name: wg-e-r1c1-xfer-20260924
          path: WG_E_R1C1_delivery.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
