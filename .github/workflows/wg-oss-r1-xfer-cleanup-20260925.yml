name: temporary WG OSS R1 transfer cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/wg-oss-r1-xfer-cleanup-20260925.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Delete temporary transfer artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for id in 10830276361 10830191553 10829788860 10829734482 10829659461; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
            echo "deleted=$id"
          done
