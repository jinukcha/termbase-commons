name: temporary WG FIT R1 transfer cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/wg-fit-r1-design-cleanup-20260924.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Delete temporary transfer artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/10808690029"
