name: temporary WG FIT R1 design transfer

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/wg-fit-r1-design-transfer-20260924.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  transfer:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out transfer pointer
        uses: actions/checkout@v4

      - name: Download and verify private source asset
        run: |
          set -euo pipefail
          URL="$(base64 -d tmp/wg-fit-r1-design-transfer-url.b64)"
          curl -fL --retry 3 "$URL" -o WG_FIT_R1_DESIGN_KIT.source.zip
          echo '960b4c88a9495d3a8019b9c9b768a5e5e032cc836db6ed19a57854bfb5fd033b  WG_FIT_R1_DESIGN_KIT.source.zip' | sha256sum -c -
          unzip -tqq WG_FIT_R1_DESIGN_KIT.source.zip
          mkdir kit
          unzip -q WG_FIT_R1_DESIGN_KIT.source.zip -d kit
          cd kit
          sha256sum -c SHA256SUMS

      - name: Validate unpacked kit
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import json
          from pathlib import Path, PurePosixPath

          root = Path('kit')
          required = [
              'README.txt',
              'design/START_HERE.md',
              'design/CURRENT_DEFECT_AUDIT.md',
              'design/WUXIA_GARMENT_VALIDITY_R1.md',
              'design/ROADMAP_R0B0E_R1.md',
              'design/ACCEPTANCE_GATES.csv',
              'design/OSS_REFERENCE_MATRIX.csv',
              'design/OSS_INTAKE_PLAN.md',
              'design/SCHEMA_EXAMPLES.json',
              'design/CURRENT_STATE.json',
              'design/UPSTREAM_PINS.json',
              'canonical/ROADMAP.md',
              'canonical/WUXIA_CAD_R0A.md',
              'canonical/R0B0E_R1_ACTIVE.md',
              'BUNDLE_MANIFEST.json',
              'PACKAGE_CHECK.json',
              'SHA256SUMS',
          ]
          missing = [p for p in required if not (root / p).is_file()]
          if missing:
              raise SystemExit(f'missing: {missing}')
          for path in (root / 'design').glob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
          json.loads((root / 'BUNDLE_MANIFEST.json').read_text(encoding='utf-8'))
          check = json.loads((root / 'PACKAGE_CHECK.json').read_text(encoding='utf-8'))
          if check.get('required_files') != 'PASS':
              raise SystemExit('package check not PASS')
          for path in (root / 'design').glob('*.csv'):
              with path.open(newline='', encoding='utf-8') as fh:
                  rows = list(csv.reader(fh))
              if len(rows) < 2 or any(len(r) != len(rows[0]) for r in rows):
                  raise SystemExit(f'invalid CSV: {path}')
          for path in root.rglob('*'):
              if path.is_symlink():
                  raise SystemExit(f'symlink: {path}')
              if path.is_file():
                  rel = path.relative_to(root).as_posix()
                  if rel.startswith('/') or '..' in PurePosixPath(rel).parts:
                      raise SystemExit(f'unsafe path: {rel}')
                  if path.suffix.lower() in {'.zip', '.whl', '.tar', '.gz', '.xz', '.7z'}:
                      raise SystemExit(f'nested archive: {rel}')
          print('pre-upload content validation PASS')
          PY

      - name: Upload direct-content design kit
        uses: actions/upload-artifact@v4
        with:
          name: WG_FIT_R1_DESIGN_KIT
          path: kit/
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
          include-hidden-files: false

  verify:
    needs: transfer
    runs-on: ubuntu-24.04
    steps:
      - name: Re-download uploaded artifact
        uses: actions/download-artifact@v4
        with:
          name: WG_FIT_R1_DESIGN_KIT
          path: reopened

      - name: Reopen exact artifact contents
        run: |
          set -euo pipefail
          cd reopened
          sha256sum -c SHA256SUMS
          python - <<'PY'
          import csv
          import json
          from pathlib import Path
          root = Path('.')
          json.loads((root / 'BUNDLE_MANIFEST.json').read_text(encoding='utf-8'))
          check = json.loads((root / 'PACKAGE_CHECK.json').read_text(encoding='utf-8'))
          assert check['required_files'] == 'PASS'
          for path in (root / 'design').glob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
          for path in (root / 'design').glob('*.csv'):
              with path.open(newline='', encoding='utf-8') as fh:
                  rows = list(csv.reader(fh))
              assert len(rows) >= 2
              assert all(len(r) == len(rows[0]) for r in rows)
          print('uploaded artifact reopen PASS')
          PY
