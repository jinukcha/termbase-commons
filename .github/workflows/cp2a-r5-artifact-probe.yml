name: CP2A R5 artifact probe

on:
  push:
    branches: [cp2a-r5-transfer-20260929]
    paths: [.github/workflows/cp2a-r5-artifact-probe.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Create probe
        run: printf 'CP2A_PUBLIC_ARTIFACT_PROBE_PASS\n' > /tmp/cp2a_probe.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cp2a-r5-artifact-probe
          path: /tmp/cp2a_probe.txt
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
