name: temporary R0B0E transfer cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/r0b0e-xfer-cleanup-20260924.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete temporary transfer artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/10789175958"
