name: One-shot TFIRV R0A-04 runtime bridge

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-tfirv-r0a04-runtime.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: tfirv-r0a04-runtime-temp
      ARCHIVE: Godot_v4.7.2-stable_linux.x86_64.zip
    steps:
      - name: Download and verify exact runtime
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-all-errors \
            -o "$ARCHIVE" \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          test "$(stat -c %s "$ARCHIVE")" = "77860424"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $ARCHIVE" | sha256sum -c -
          unzip -q "$ARCHIVE" -d exact_runtime
          chmod +x exact_runtime/Godot_v4.7.2-stable_linux.x86_64
          test "$(exact_runtime/Godot_v4.7.2-stable_linux.x86_64 --version)" = "4.7.2.stable.official.ed1daf0bf"
          echo "8d106cbe6144c2dc7e881d61d2429c1a8a76e6b22ef48bd5e48dcf934953f71e  exact_runtime/Godot_v4.7.2-stable_linux.x86_64" | sha256sum -c -
      - name: Publish temporary release asset
        run: |
          set -euo pipefail
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create "$TAG" "$ARCHIVE" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Temporary TFIRV R0A-04 runtime bridge" \
            --notes "Verified public Godot 4.7.2 Linux x86_64 archive. Temporary transfer asset."
          echo "TFIRV_RUNTIME_URL=https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$ARCHIVE"
