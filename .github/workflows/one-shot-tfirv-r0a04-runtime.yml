name: One-shot TFIRV R0A-04 cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-tfirv-r0a04-runtime.yml

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: tfirv-r0a04-runtime-temp
      ARTIFACT_ID: "11853457914"
    steps:
      - name: Remove temporary release and transfer artifact
        run: |
          set -euo pipefail
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" || true
