name: temporary R0B0E transfer

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/r0b0e-xfer-20260924.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Check out temporary pointer
        uses: actions/checkout@v4

      - name: Download verified short-lived source
        run: |
          set -euo pipefail
          URL="$(base64 -d tmp/r0b0e-transfer-url.b64)"
          curl -fL --retry 3 "$URL" -o WG_E_chat_delivery.zip
          echo '6be062e8bb9d03cfdbc74984a4ee2aaa3200c53cbc9309c926392dcc23c1cdfc  WG_E_chat_delivery.zip' | sha256sum -c -
          unzip -tqq WG_E_chat_delivery.zip

      - name: Upload temporary connector artifact
        uses: actions/upload-artifact@v4
        with:
          name: r0b0e-xfer-7f2c9a
          path: WG_E_chat_delivery.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
