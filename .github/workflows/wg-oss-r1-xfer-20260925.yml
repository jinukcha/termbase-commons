name: temporary WG OSS R1 transfer

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/wg-oss-r1-xfer-20260925.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SRC_URL_B64: 
      PATCH_URL_B64: 
      FULL_URL_B64: 
      KIT_URL_B64: 
      STATUS_URL_B64: 

    steps:
      - name: Download and verify source
        run: |
          set -euo pipefail
          printf '%s' "$SRC_URL_B64" | base64 -d | xargs -r curl -fL --retry 3 -o WG_OSS_R1_src.zip
          echo '38503133e78798a4aeb7180304386da500ebad71ce32c26c15aad2853dcd1948  WG_OSS_R1_src.zip' | sha256sum -c -
          unzip -tqq WG_OSS_R1_src.zip
      - name: Download and verify patch
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_URL_B64" | base64 -d | xargs -r curl -fL --retry 3 -o WG_OSS_R1_patch.zip
          echo 'cc5395a35cdc18c61dea6436e8ae1229fa5334f904a289ccf892e9300cde5c80  WG_OSS_R1_patch.zip' | sha256sum -c -
          unzip -tqq WG_OSS_R1_patch.zip
      - name: Download and verify full
        run: |
          set -euo pipefail
          printf '%s' "$FULL_URL_B64" | base64 -d | xargs -r curl -fL --retry 3 -o WG_OSS_R1_full.zip
          echo 'ae91c52fc8946b70537b50410f3ef643aab7eab1a482b08f2c8b76f6181dd383  WG_OSS_R1_full.zip' | sha256sum -c -
          unzip -tqq WG_OSS_R1_full.zip
      - name: Download and verify kit
        run: |
          set -euo pipefail
          printf '%s' "$KIT_URL_B64" | base64 -d | xargs -r curl -fL --retry 3 -o WG_OSS_R1_kit.zip
          echo '28ff827c31a013625640b847902d9140fcea5bbf7e9c57b5857bf1c431227f65  WG_OSS_R1_kit.zip' | sha256sum -c -
          unzip -tqq WG_OSS_R1_kit.zip
      - name: Download and verify current status
        run: |
          set -euo pipefail
          printf '%s' "$STATUS_URL_B64" | base64 -d | xargs -r curl -fL --retry 3 -o WG_CURRENT_STATUS.md
          echo '32979cd8efbb4a50fbbc6e0e01ca124c09d1acd0bb55369a7be18c81b25c73bc  WG_CURRENT_STATUS.md' | sha256sum -c -

      - name: Upload source transfer
        uses: actions/upload-artifact@v4
        with:
          name: wg-oss-r1-src-xfer
          path: WG_OSS_R1_src.zip
          retention-days: 1
          compression-level: 0
      - name: Upload patch transfer
        uses: actions/upload-artifact@v4
        with:
          name: wg-oss-r1-patch-xfer
          path: WG_OSS_R1_patch.zip
          retention-days: 1
          compression-level: 0
      - name: Upload full transfer
        uses: actions/upload-artifact@v4
        with:
          name: wg-oss-r1-full-xfer
          path: WG_OSS_R1_full.zip
          retention-days: 1
          compression-level: 0
      - name: Upload kit transfer
        uses: actions/upload-artifact@v4
        with:
          name: wg-oss-r1-kit-xfer
          path: WG_OSS_R1_kit.zip
          retention-days: 1
          compression-level: 0
      - name: Upload status transfer
        uses: actions/upload-artifact@v4
        with:
          name: wg-oss-r1-status-xfer
          path: WG_CURRENT_STATUS.md
          retention-days: 1
          compression-level: 0
